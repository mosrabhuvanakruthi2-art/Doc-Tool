services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      ASSETS_DIR: /app/data
    volumes:
      - uploads:/app/data
    # MongoDB runs on the host, not in a container: point MONGODB_URI in
    # server/.env at mongodb://host.docker.internal:27017/<db>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Expose server to localhost only — nginx proxies /api/ here
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - doc-tool-net

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8131:80"
    depends_on:
      - server
    networks:
      - doc-tool-net

networks:
  doc-tool-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24

volumes:
  uploads:
